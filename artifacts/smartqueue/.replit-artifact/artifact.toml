kind = "web"
previewPath = "/"
title = "SmartQueue Procurement"
description = "A farmer-first procurement booking and live queue platform for reducing waiting time at agricultural collection centres across India."
version = "1.0.0"
id = "artifacts/smartqueue"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20167

[services.development]
run = "pnpm --filter @workspace/smartqueue run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/smartqueue", "run", "build" ]
serve = "static"
publicDir = "artifacts/smartqueue/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20167"
BASE_PATH = "/"
